name: Verify offline project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check Python dependencies
        run: python -m pip check
      - name: Install locked Node dependencies
        run: npm ci
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run live speech state tests
        run: npm run test:voice
      - name: Check evaluation report semantics
        run: npm run test:eval
      - name: Compare constructed retrieval cases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python evals/run_retrieval_eval.py --compare > artifacts/retrieval-comparison.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run headless offline browser flow
        shell: pwsh
        run: |
          $browserLog = @()
          try {
            .\tools\check-browser.ps1 2>&1 | Tee-Object -Variable browserLog
          } catch {
            $details = (($browserLog | Select-Object -Last 100 | ForEach-Object { "$_" }) -join "`n")
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Offline browser failure::$details"
            throw
          }
      - name: Save retrieval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: constructed-retrieval-comparison
          path: artifacts/retrieval-comparison.json
          if-no-files-found: ignore
